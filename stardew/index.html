  <h1>《星露谷物语》：一座农场，一段人生</h1>
  <p>《星露谷物语》（Stardew Valley）是一款由 ConcernedApe（Eric Barone）单人独立开发的农场模拟经营游戏，2016 年正式发售。玩家扮演厌倦了都市生活的上班族，继承爷爷留在星露谷的老旧农场，从此开启一段远离喧嚣的田园人生。</p>
